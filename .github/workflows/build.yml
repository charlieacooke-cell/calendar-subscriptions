name: Build calendar feeds

on:
  schedule:
    # 19:00 UTC daily = 6am AEDT / 5am AEST.
    - cron: '0 19 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'state/**'
      - 'README.md'

permissions:
  contents: write

concurrency:
  group: build-feeds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate feeds
        run: python generate.py

      - name: Commit any fixture changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs state

          if git diff --cached --quiet; then
            echo "Nothing changed at all."
            exit 0
          fi

          # DTSTAMP and the page footer move on every single run. Committing
          # those would mean a commit a day of pure noise, which defeats the
          # point of having a readable history of fixture changes.
          substantive=$(git diff --cached -U0 -- docs \
            | grep -E '^[+-]' \
            | grep -vE '^(\+\+\+|---)' \
            | sed -E 's/^[+-][[:space:]]*//' \
            | grep -vE '^(DTSTAMP:|<footer>Last built)' \
            | wc -l)

          if [ "$substantive" -eq 0 ]; then
            echo "Only timestamps changed; skipping commit."
            git reset
            exit 0
          fi

          git commit -m "Update fixtures ($(date -u +%Y-%m-%d))"

          # A concurrent run, or a manual push, may have landed first.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected; rebasing on origin/main (attempt $attempt)."
            git pull --rebase --autostash origin main
          done
          echo "::error::Could not push after 3 attempts."
          exit 1
